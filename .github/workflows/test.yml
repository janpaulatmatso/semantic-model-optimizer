name: Tests and release

# On every push to main: run the tests, and when code changed, build the portable executable
# and publish it as a new release (the patch number goes up by one).
# Run it by hand ("Run workflow") to publish a release even when only documentation changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5   # the Fabric notebook is Python; its results are compared with the JavaScript
        with:
          python-version: '3.11'
      - run: node --test test/smo.test.js

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write      # signs the build provenance
      attestations: write  # stores it, so anyone can check where a file came from
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did code change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "release=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          # everything except documentation, tests and the workflow itself ends up in the executable
          files=$(git diff --name-only $range -- . ':(exclude)*.md' ':(exclude)test/**' ':(exclude).github/**' ':(exclude).gitignore' ':(exclude)LICENSE' || true)
          echo "Changed since ${last:-the start}:"; echo "$files"
          if [ -n "$files" ]; then echo "release=yes" >> "$GITHUB_OUTPUT"; else echo "release=no" >> "$GITHUB_OUTPUT"; fi

      - name: Next version
        if: steps.changed.outputs.release == 'yes'
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          case "${{ github.event.inputs.bump || 'patch' }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Next version: v$major.$minor.$patch (after $last)"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.release == 'yes'
        with:
          node-version: 22

      - name: Build the executable
        if: steps.changed.outputs.release == 'yes'
        env:
          SMO_VERSION: ${{ steps.version.outputs.tag }}
        run: node build-exe.js

      - name: Build the Fabric notebook
        if: steps.changed.outputs.release == 'yes'
        env:
          SMO_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          node build-fabric.js
          grep -q "VERSION = \"${SMO_VERSION#v}\"" fabric/SemanticModelOptimizer.py

      - name: Check the executable
        if: steps.changed.outputs.release == 'yes'
        run: |
          exe=dist/SemanticModelOptimizer.exe
          tag="${{ steps.version.outputs.tag }}"
          "$exe" version | tee version.txt
          grep -qxF "Semantic Model Optimizer ${tag#v}" version.txt
          project=$(node -e "console.log(require('./test/fixture.js').makeProject())")
          "$exe" cli "$project" --check
          "$exe" cli "$project" --export pbi-export
          test -f "pbi-export/Semantic Model Optimizer.pbip"
          test -s pbi-export/data/run-000001/objects.csv

      - name: Install Inno Setup
        if: steps.changed.outputs.release == 'yes'
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        if: steps.changed.outputs.release == 'yes'
        env:
          SMO_VERSION: ${{ steps.version.outputs.tag }}
        run: node build-installer.js

      - name: Check the installer (install, run, uninstall)
        if: steps.changed.outputs.release == 'yes'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smo-install'
          $p = Start-Process dist\SemanticModelOptimizer-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exited with $($p.ExitCode)" }
          # the installed program has no console, so check it through its server
          $env:PORT = '5391'; $env:SMO_IDLE_EXIT = '60'
          $s = Start-Process "$dir\SemanticModelOptimizer.exe" -ArgumentList 'serve' -PassThru
          $ping = $null
          for ($i = 0; $i -lt 30 -and -not $ping; $i++) { Start-Sleep 1; try { $ping = (Invoke-WebRequest http://127.0.0.1:5391/api/ping -UseBasicParsing).Content | ConvertFrom-Json } catch { } }
          Write-Output "Installed program answers: version $($ping.version)"
          $tag = '${{ steps.version.outputs.tag }}'
          if ($ping.version -ne $tag.TrimStart('v')) { throw "Installed version is '$($ping.version)'" }
          Start-Process "$dir\SemanticModelOptimizer.exe" -ArgumentList 'stop' -Wait
          for ($i = 0; $i -lt 20 -and -not $s.HasExited; $i++) { Start-Sleep 1 }
          if (-not $s.HasExited) { throw 'The program did not stop' }
          if (-not (Test-Path "$dir\unins000.exe")) { throw 'No uninstaller was installed' }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\SemanticModelOptimizer.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\SemanticModelOptimizer.exe") { throw 'The uninstaller left the program behind' }
          Write-Output 'Install and uninstall OK'

      - name: Build the Store package (MSIX)
        if: steps.changed.outputs.release == 'yes'
        env:
          SMO_VERSION: ${{ steps.version.outputs.tag }}
          # from Partner Center › Product identity; without them a test package is built
          SMO_MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          SMO_MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          SMO_MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node build-msix.js

      - name: Check the Store package (sign a copy with a test certificate, install, run, remove)
        if: steps.changed.outputs.release == 'yes'
        shell: pwsh
        run: |
          [xml]$m = Get-Content dist\msix\AppxManifest.xml
          $name = $m.Package.Identity.Name; $publisher = $m.Package.Identity.Publisher
          # the Store signs the real package; this copy is signed only to install it here
          $test = Join-Path $env:RUNNER_TEMP 'smo-test.msix'
          Copy-Item dist\SemanticModelOptimizer.msix $test
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName 'SMO test' -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'smo-test' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'smo-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p smo-test $test
          if ($LASTEXITCODE) { throw 'signtool failed' }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name $name
          if (-not $pkg) { throw 'The package was not installed' }
          Write-Output "Installed $($pkg.PackageFullName)"
          $cli = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\SemanticModelOptimizer-cli.exe'
          if (-not (Test-Path $cli)) { throw 'The command line alias was not created' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\SemanticModelOptimizer.exe'))) { throw 'The program alias was not created' }
          $v = & $cli version
          Write-Output "From the package: $v"
          $tag = '${{ steps.version.outputs.tag }}'
          if ($v -ne "Semantic Model Optimizer $($tag.TrimStart('v'))") { throw "Wrong version from the package: $v" }
          $project = node -e "console.log(require('./test/fixture.js').makeProject())"
          & $cli cli $project --check
          # the server and a PowerShell helper, run from inside the package
          $env:PORT = '5392'; $env:SMO_IDLE_EXIT = '60'
          $s = Start-Process $cli -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          $ping = $null
          for ($i = 0; $i -lt 30 -and -not $ping; $i++) { Start-Sleep 1; try { $ping = (Invoke-WebRequest http://127.0.0.1:5392/api/ping -UseBasicParsing).Content | ConvertFrom-Json } catch { } }
          if (-not $ping -or $ping.version -ne $tag.TrimStart('v')) { throw "The packaged server did not answer with version $tag" }
          $desk = (Invoke-WebRequest http://127.0.0.1:5392/api/desktop -UseBasicParsing -TimeoutSec 120).Content | ConvertFrom-Json
          if ($desk.error) { throw "PowerShell helper failed inside the package: $($desk.error)" }
          Write-Output "PowerShell helper answered: $($desk.instances.Count) Power BI Desktop instances"
          & $cli stop
          for ($i = 0; $i -lt 20 -and -not $s.HasExited; $i++) { Start-Sleep 1 }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name $name) { throw 'The package was not removed' }
          Write-Output 'Store package: install, run and remove OK'

      - name: Keep the Store package (upload it in Partner Center)
        if: steps.changed.outputs.release == 'yes' && vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: store-package-${{ steps.version.outputs.tag }}
          path: dist/SemanticModelOptimizer.msix

      - name: Checksums
        if: steps.changed.outputs.release == 'yes'
        run: |
          # the program people download is the one without a console window
          cp dist/app/SemanticModelOptimizer.exe dist/SemanticModelOptimizer.exe
          cd dist && sha256sum SemanticModelOptimizer-Setup.exe SemanticModelOptimizer.exe SemanticModelOptimizer-cli.exe | sed 's/ \*/  /' | tee SHA256SUMS.txt

      - name: Build provenance (proof that GitHub Actions built these files from this commit)
        if: steps.changed.outputs.release == 'yes'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SemanticModelOptimizer-Setup.exe
            dist/SemanticModelOptimizer.exe
            dist/SemanticModelOptimizer-cli.exe

      - name: Keep the build (not on main)
        if: steps.changed.outputs.release == 'yes' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/SemanticModelOptimizer.exe
            dist/SemanticModelOptimizer-cli.exe
            dist/SemanticModelOptimizer-Setup.exe
            dist/SemanticModelOptimizer.msix
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: steps.changed.outputs.release == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          {
            echo "Downloads for Windows:"
            echo
            echo '- **`SemanticModelOptimizer-Setup.exe`**: installs the tool as a program, with a shortcut in the Start menu, an uninstaller under *Apps*, and (when installed for all users) the button in Power BI Desktop. No administrator rights needed for yourself.'
            echo '- **`SemanticModelOptimizer.exe`**: the same program without installing; one file you can start from anywhere.'
            echo '- **`SemanticModelOptimizer-cli.exe`**: for the command line and pipelines (`SemanticModelOptimizer-cli.exe cli <folder> --check`).'
            echo
            echo 'The tool opens in its own window (an app window of your default browser when that is Edge, Chrome or Brave, otherwise Edge) and stops by itself a few minutes after you close it.'
            echo
            echo "## Changes since $LAST"
            echo
            git log --no-merges --pretty='- %s' "$LAST..HEAD" 2>/dev/null || git log --no-merges --pretty='- %s' -20
            echo
            echo "## Use"
            echo
            echo '- Start the tool from the Start menu, or double-click `SemanticModelOptimizer.exe`.'
            echo '- Command line: `SemanticModelOptimizer-cli.exe cli <folder> --check`'
            echo '- Power BI report of the results: `SemanticModelOptimizer-cli.exe cli <folder> --export C:\SMO`, then open `C:\SMO\Semantic Model Optimizer.pbip` and choose *Refresh*. Every export adds a run, so the report shows the trend. Every model in your workspaces: `--scan "<workspace>" --export C:\SMO`.'
            echo '- In Microsoft Fabric: import `SemanticModelOptimizer.ipynb` as a notebook (or paste `SemanticModelOptimizer.py` into one cell), add a Lakehouse and schedule it. The whole tool is in the notebook, in Python: it downloads nothing. See the README.'
            echo '- Button in Power BI Desktop: tick it in Setup when installing for all users, or run `SemanticModelOptimizer-cli.exe install-tool` in a terminal started as administrator.'
            echo
            echo '## Check the files'
            echo
            echo 'Built automatically by GitHub Actions from commit ${{ github.sha }}, with a signed build provenance. To check that a file you downloaded is exactly that build:'
            echo
            echo '```'
            echo 'gh attestation verify SemanticModelOptimizer-Setup.exe --repo ${{ github.repository }}'
            echo '```'
            echo
            echo 'Or compare its SHA-256 (PowerShell: `Get-FileHash SemanticModelOptimizer-Setup.exe`) with `SHA256SUMS.txt`.'
            echo 'The files have no code-signing certificate, so Windows SmartScreen may warn the first time (choose *More info* › *Run anyway*).'
            echo 'Rather not run a program at all? Use the web version: https://janpaulatmatso.github.io/semantic-model-optimizer/'
          } > notes.md
          gh release create "$TAG" dist/SemanticModelOptimizer-Setup.exe dist/SemanticModelOptimizer.exe dist/SemanticModelOptimizer-cli.exe dist/SHA256SUMS.txt fabric/SemanticModelOptimizer.ipynb fabric/SemanticModelOptimizer.py --target "${{ github.sha }}" --title "Semantic Model Optimizer ${TAG#v}" --notes-file notes.md --latest
